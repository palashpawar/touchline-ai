    <path d="M150 176 H362 L430 360 H82 Z"/>
    <path d="M256 176 V360"/>
    <ellipse cx="256" cy="262" rx="46" ry="26"/>
  </g>
  <circle cx="256" cy="262" r="7" fill="#f1f5f9"/>
  <!-- viewfinder brackets: the system watching (and checking) the view -->
  <g fill="none" stroke="#4ade80" stroke-width="16" stroke-linecap="round" stroke-linejoin="round">
    <path d="M70 150 V104 H116"/><path d="M396 104 H442 V150"/>
    <path d="M442 362 V408 H396"/><path d="M116 408 H70 V362"/>
