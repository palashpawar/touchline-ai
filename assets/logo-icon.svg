<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Touchline AI">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#13284a"/>
      <stop offset="1" stop-color="#0a1120"/>
    </linearGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f8a4c"/>
      <stop offset="1" stop-color="#16a34a"/>
    </linearGradient>
    <clipPath id="pitch"><path d="M150 176 H362 L430 360 H82 Z"/></clipPath>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- pitch in perspective, as seen from the stands -->
  <path d="M150 176 H362 L430 360 H82 Z" fill="url(#grass)"/>
  <g clip-path="url(#pitch)" fill="#22c55e" opacity="0.35">
    <path d="M150 176 H192 L170 360 H82 Z"/><path d="M234 176 H278 L301 360 H213 Z"/><path d="M320 176 H362 L430 360 H342 Z"/>
  </g>
